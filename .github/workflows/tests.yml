name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t zf-mcp .
      - name: Container starten und /health sowie /mcp prüfen
        run: |
          docker run -d --name zf -p 8000:8000 -e ZF_VORLADEN=0 zf-mcp
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs http://localhost:8000/health
          curl -fs -X POST http://localhost:8000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q zustaendigkeit_finden
      - if: failure()
        run: docker logs zf
