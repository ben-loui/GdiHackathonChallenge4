# Behördenkategorien (36, projektspezifisch) -> Datenquellen
#
# key         Schlüsselwort, wie es die semantische Suche (Elasticsearch) liefert
# label       Anzeigename; Teile mit "/" gelten zusätzlich als Synonyme
# synonyme    weitere Schreibweisen (Groß-/Kleinschreibung, Umlaute und Satzzeichen egal)
# flaechen    Behördentypen aus quellen/*.toml: Name der Stelle aus der Zuständigkeitsfläche.
#             Nicht konfigurierte Typen (z. B. ohne quellen/bzb-eigen.toml) werden übersprungen.
# leistungen  LeiKa-Schlüssel typischer Leistungen ("Leitleistungen"). PVOG wird mit dem ARS der
#             Gemeinde der Reihe nach abgefragt, bis eine Leistung zuständige Stellen liefert.
#             Ein vom Aufrufer übergebener Leistungsschlüssel wird immer zuerst versucht.
# raeumlich   false: Zuständigkeit hängt nicht vom Wohnort ab (z. B. eigene Krankenkasse)
# hinweis     wird jeder Antwort dieser Kategorie mitgegeben
#
# Die Leitleistungen wurden am 13.11.2026 gegen PVOG in Mainz, Ingelheim (Lkr. Mainz-Bingen),
# München, Hamburg und Köln geprüft. Fachlich vor Produktivbetrieb prüfen lassen.

[[kategorie]]
