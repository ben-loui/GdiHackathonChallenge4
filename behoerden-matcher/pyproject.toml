[project]
name = "behoerden-matcher"
version = "0.3.0"
description = "FIM Leistungen zu Behördenkategorien ohne Standort"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.2,<2", "requests>=2.31,<3"]
[project.optional-dependencies]
elastic = ["elasticsearch>=8.17,<8.18"]
semantic = ["sentence-transformers>=3,<6"]
test = ["pytest>=8"]
[project.scripts]
behoerden-match = "authority_matcher.cli:main"
authority-matcher = "authority_matcher.autorun:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["authority_matcher*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
