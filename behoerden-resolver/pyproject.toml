[project]
name = "behoerden-resolver"
version = "0.2.0"
description = "Quellenbasierter räumlicher Behördenresolver für Deutschland"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4", "shapely>=2.1,<3", "pyproj>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
docs = ["python-docx>=1.1,<2"]

[project.scripts]
behoerden-resolver = "behoerden_resolver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
behoerden_resolver = ["resources/*.json", "resources/*.sql", "resources/*.csv", "resources/*.overpass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running PostGIS database"]
